services:
  postgres:
    image: postgres:16
    container_name: ocean-waves-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ocean_db
      POSTGRES_USER: ocean_user
      POSTGRES_PASSWORD: ocean_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ocean-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocean_user -d ocean_db || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ocean-waves-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ocean.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    networks:
      - ocean-network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  ocean-network:
    driver: bridge
